# Minimal Tier-1 expectations for BurntSushi/ripgrep#3472 ("ignore: add
# incremental checking"). A conservative FLOOR, not full expected output.
# Provenance/excerpt verification applies to every node separately (see
# test_golden_set.py).
pr: 3472
source: BurntSushi/ripgrep#3472

required_node_types: # >=1 node of each type must be present
  - goal # incremental ignore-checking of individual paths w/o full re-traversal

must_mention: # >=1 node whose content contains each (case-insensitive substring)
  - incremental
  - ignore

notes: |
  Thinnest fixture: essentially body-only (1 conversation comment; the design
  edge-case discussion is in REVIEW comments, which the Phase 0 connector does
  not fetch -- a real connector-scope characteristic, not a recording mistake).
  Kept deliberately -- it tests extraction on sparse but real input. The floor is
  just `goal`; the file-watcher rationale and the "reuses existing gitignore logic
  without changes" constraint are extractable but not required.
