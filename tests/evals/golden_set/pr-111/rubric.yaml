# Minimal Tier-1 expectations for BurntSushi/ripgrep#111 ("Max depth option").
# A conservative FLOOR, not the full expected output -- a good extraction may and
# should produce more. Provenance/excerpt verification applies to every node
# separately (see test_golden_set.py) and is not encoded here. Revisit a floor
# explicitly (never silently drop it) if a real run shows it is wrong; record why
# via docs-sync.
pr: 111
source: BurntSushi/ripgrep#111

# The PR body is literally only "Closes #109", so the goal is recoverable ONLY by
# following the link to issue #109 -- this fixture is the sharpest test of that
# agentic fetch_linked_issue behavior.
required_node_types: # >=1 node of each type must be present
  - goal # issue #109: "add an option to skip traversing directories"
  - decision # align --maxdepth semantics with GNU find (comment thread)

must_mention: # >=1 node whose content contains each (case-insensitive substring)
  - depth

notes: |
  Design discussion here is conversation comments (captured by the connector).
  The core semantics decision -- GNU find alignment, "starting points" vs
  "current directory" -- lives in the comment thread, not the 13-char body.
