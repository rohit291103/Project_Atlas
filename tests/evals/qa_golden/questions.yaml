# Q&A golden set (Phase 3 `writing-evals` obligation), written 2026-09-30
# BEFORE any answer was recorded. Each document is a real recorded extraction
# from tests/evals/golden_set/, with every claim treated as confirmed in memory
# -- this grades answering, not curation. Expectations are Tier-1 floors:
#
#   expect: answer      >=1 citation, a cited claim contains `keyword`
#                       (case-insensitive), evidence is not "none"
