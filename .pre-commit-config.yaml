repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run mypy in the project's uv environment (not pre-commit's isolated venv) so
  # it sees real third-party types (sqlalchemy, pydantic, ...) and stays in lock-
  # step with CI's `uv run mypy src`. Avoids maintaining a parallel
  # additional_dependencies list that silently drifts as src/ gains imports.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, matches CI)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
