repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Not over recorded artifacts: proof/ inputs and outputs and the eval
      # fixtures must stay byte-exact (a stripped space in a control prompt is
      # a change to the experiment -- proof/deviations.md #2).
      - id: trailing-whitespace
        exclude: ^(proof(-v2)?/|tests/evals/)
      - id: end-of-file-fixer
        exclude: ^(proof(-v2)?/|tests/evals/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run mypy in the project's uv environment (not pre-commit's isolated venv) so
  # it sees real third-party types (sqlalchemy, pydantic, ...) and stays in lock-
  # step with CI's `uv run mypy src`. Avoids maintaining a parallel
  # additional_dependencies list that silently drifts as src/ gains imports.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, matches CI)
        entry: uv run mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false
