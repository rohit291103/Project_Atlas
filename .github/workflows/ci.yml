name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # `tests` joined `src` and `scripts` here on 2026-08-15, when the 17
      # pre-existing strict errors in the suite were fixed. A test file is the
      # thing most likely to paper over a type change with an `Any`, so leaving
      # it unchecked was the wrong half of the codebase to exempt.
      - name: Type check (mypy)
        run: uv run mypy src scripts tests

      - name: Test (pytest)
        run: uv run pytest
