# Render Blueprint — one free Docker web service, one instance.
#
# Region is Singapore because Supabase is in `aws-1-ap-northeast-2` (Seoul) and
# this app replays the whole event log per request; every extra 100ms of
# database round-trip is paid several times on a single page load. Oregon would
# cross the Pacific twice for the same work.
#
# Secrets are `sync: false` — Render prompts for them on first deploy and stores
# them on the service. They are deliberately not in this file, which is
# committed.
services:
  - type: web
    name: atlas
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Proves the process is up *and* that the SPA bundle shipped. Deliberately
    # not a database probe: restarting this container cannot fix a managed
    # Postgres, and a probe would turn a Supabase blip into a restart loop.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The `atlas_app` role's URL — least privilege, RLS applies. Never the
      # admin URL; migrations are run from a laptop, not by the web process.
      - key: SUPABASE_DB_URL
        sync: false
      - key: ATLAS_APP_PASSPHRASE
        sync: false
      - key: ATLAS_SESSION_SECRET
        sync: false
      # Lose this and every stored source credential is undecryptable. There is
      # no rotation path yet (roadmap-v2 Phase 4).
      - key: ATLAS_SECRET_KEY
        sync: false
